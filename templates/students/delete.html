{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h1>Delete Student</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-delete">
            Yes, Delete
        </button>
        <a href="{% url 'student_list' %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
